  <circle cx="62" cy="47" r="4" fill="#98988e"/>
  <circle cx="77" cy="47" r="4" fill="#c7ff18"/>

  <g font-family="'IBM Plex Mono', Consolas, monospace" fill="#c7ff18" font-size="18">
    <text x="95" y="53" fill="#b4b4a8" font-size="16">diogo@portfolio: ~</text>
    <text x="48" y="112">$ whoami</text>
    <text x="48" y="241" fill="#b4b4a8" font-size="16">PORTUGAL / SECURITY · ENGINEERING · GRC</text>
    <text x="48" y="523">$ cat stack.txt</text>
  </g>
  <g font-family="Arial, sans-serif" fill="#f2f0e8">
    <text x="44" y="176" font-family="'Archivo Black', Arial, sans-serif" font-weight="900" font-size="64">Diogo <tspan fill="#c7ff18">Andrade</tspan></text>
    <text x="48" y="210" font-size="21" font-weight="700">Computer Engineer · Cybersecurity &amp; Digital Forensics</text>
    <text x="48" y="307" font-size="19">
      <tspan x="48">I’m a Computer Engineer based in Portugal with an MSc in Cybersecurity</tspan>
      <tspan x="48" dy="27">and Digital Forensics. I assess systems, investigate threats and turn</tspan>
      <tspan x="48" dy="27">security findings into practical improvements.</tspan>
      <tspan x="48" dy="36">I carried out security diagnostics and maturity assessments across</tspan>
      <tspan x="48" dy="27"><tspan fill="#c7ff18" font-weight="700">80+ organisations</tspan> and taught systems administration, operating</tspan>
      <tspan x="48" dy="27">systems, databases and computer technology as a teaching assistant.</tspan>
    </text>
  </g>

  <g font-family="'IBM Plex Mono', Consolas, monospace" font-size="15">
    <path d="M48 542H712V727H48Z M48 579H712 M48 616H712 M48 653H712 M48 690H712 M275 542V727" fill="none" stroke="#34342e"/>
