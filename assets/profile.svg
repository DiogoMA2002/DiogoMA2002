<svg xmlns="http://www.w3.org/2000/svg" width="760" height="784" viewBox="0 0 760 784" role="img" aria-labelledby="title description">
  <title id="title">Diogo Andrade · Computer Engineer</title>
  <desc id="description">Biography and technical stack for Diogo Andrade, a computer engineer based in Portugal.</desc>
  <defs>
