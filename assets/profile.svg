      <stop stop-color="#11110e"/>
      <stop offset="1" stop-color="#242d0d"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="758" height="782" rx="14" fill="#0a0a08" stroke="#34342e" stroke-width="2"/>
  <rect x="2" y="2" width="756" height="780" rx="13" fill="url(#grid)"/>
  <rect x="24" y="24" width="712" height="736" rx="8" fill="#11110e" stroke="#5a5a4e"/>
  <path d="M25 70H735V265H25Z" fill="url(#hero)"/>
  <path d="M24 70H736 M24 265H736 M24 480H736" stroke="#34342e"/>
